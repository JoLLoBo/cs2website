<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2.com</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        overflow: hidden;
        height: 100vh;
      }

      /* LEFT SIDEBAR */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        background: #18181b;
        border-right: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        z-index: 1000;
        box-shadow: 4px 0 12px rgba(0, 0, 0, 0.3);
      }
      .logo {
        padding: 24px 20px 16px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #fff;
        border-bottom: 1px solid #27272a;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo::before {
        content: "🧬";
        font-size: 32px;
      }
      .nav {
        flex: 1;
        padding: 12px 0;
      }
      .nav-item {
        position: relative;
        cursor: pointer;
      }
      .nav-button {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 24px;
        font-size: 17px;
        font-weight: 500;
        color: #e0e0e0;
        text-decoration: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
      }
      .nav-button:hover {
        background: #27272a;
        color: #ffffff;
      }
      .nav-button:hover .icon {
        transform: scale(1.15);
      }
      .icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        transition: transform 0.2s;
      }

      /* FIXED SUBMENU */
      .submenu {
        display: none;
        position: absolute;
        top: 0;
        left: 100%;
        margin-left: -8px;
        width: 260px;
        background: #27272a;
        border-radius: 8px;
        box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.4);
        padding: 8px 0;
        z-index: 2000;
        opacity: 0;
        transform: translateX(-10px);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .nav-item:hover .submenu {
        display: block;
        opacity: 1;
        transform: translateX(0);
      }
      .submenu-item {
        display: block;
        padding: 14px 24px;
        color: #e0e0e0;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.2s;
      }
      .submenu-item:hover {
        background: #3b3b40;
        padding-left: 32px;
        color: #fff;
      }
      .submenu-divider {
        height: 1px;
        background: #3b3b40;
        margin: 8px 16px;
      }

      /* MAIN CONTENT AREA */
      .main {
        margin-left: 260px;
        height: 100vh;
        background: linear-gradient(145deg, #1a1a1e, #111113);
        overflow-y: auto;
        padding: 40px;
      }

      .lessons-page,
      .puzzle-page {
        max-width: 1100px;
        margin: 0 auto;
      }
      .lessons-header {
        margin-bottom: 32px;
      }
      .lessons-header h1 {
        font-size: 32px;
        font-weight: 600;
        color: #fff;
      }
      .breadcrumb {
        color: #58c2f2;
        font-size: 15px;
        margin-bottom: 8px;
      }

      .side-selector {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        border-bottom: 2px solid #27272a;
        padding-bottom: 16px;
      }
      .side-btn {
        flex: 1;
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 600;
        background: #27272a;
        color: #e0e0e0;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .side-btn.active {
        background: #58c2f2;
        color: #000;
        transform: scale(1.03);
      }
      .side-btn.ct::before {
        content: "🛡️";
      }
      .side-btn.t::before {
        content: "🔥";
      }

      .phase-selector {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }
      .phase-btn {
        padding: 12px 28px;
        background: #27272a;
        color: #e0e0e0;
        border: none;
        border-radius: 9999px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }
      .phase-btn.active {
        background: #58c2f2;
        color: #000;
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 24px;
      }
      .video-card {
        background: #27272a;
        border-radius: 12px;
        overflow: hidden;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        cursor: pointer;
      }
      .video-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(88, 194, 242, 0.2);
      }
      .thumbnail {
        height: 180px;
        background: #1a1a1e;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: #58c2f2;
        overflow: hidden;
      }
      .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumbnail::after {
        content: "▶";
        position: absolute;
        font-size: 42px;
        background: rgba(0, 0, 0, 0.6);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.9;
        z-index: 2;
      }
      .video-info {
        padding: 16px;
      }
      .video-info h3 {
        font-size: 17px;
        line-height: 1.3;
        margin-bottom: 6px;
        color: #fff;
      }
      .video-info .duration {
        font-size: 13px;
        color: #58c2f2;
        font-weight: 500;
      }
      .video-info p {
        font-size: 14px;
        color: #aaa;
        margin-top: 8px;
        line-height: 1.4;
      }
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #666;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #27272a;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 24px;
        cursor: pointer;
        transition: 0.2s;
      }
      .back-btn:hover {
        background: #58c2f2;
        color: #000;
      }

      /* PUZZLE PAGE STYLES */
      .map-container {
        position: relative;
        display: block;
        max-width: 820px;
        background: #111113;
        padding: 20px;
        border: 6px solid #27272a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .map-container img {
        width: 100%;
        display: block;
        border-radius: 8px;
        filter: brightness(1.25) contrast(1.15);
      }

      .blue-dot {
        position: absolute;
        width: 24px;
        height: 24px;
        background: #58c2f2;
        color: #111;
        border: 3px solid #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 0 0 5px rgba(88, 194, 242, 0.4);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
        transform: translate(-50%, -50%);
      }
      .blue-dot:hover {
        transform: translate(-50%, -50%) scale(1.15);
        box-shadow: 0 0 0 8px rgba(88, 194, 242, 0.6);
      }

      .blue-dot.correct {
        background: #c084fc;
        box-shadow: 0 0 0 5px rgba(192, 132, 252, 0.6);
      }
      .blue-dot.wrong {
        background: #e8c39e;
        box-shadow: 0 0 0 5px rgba(232, 195, 158, 0.6);
      }

      .puzzle-wrapper {
        display: flex;
        gap: 40px;
        align-items: flex-start;
        max-width: 1200px;
        margin: 0 auto;
      }
      .puzzle-feedback-side {
        flex: 0 0 520px;
        position: sticky;
        top: 40px;
        border-radius: 12px;
        padding: 28px;
        font-size: 19px;
        font-weight: 600;
      }
      #puzzle-feedback {
        min-height: 100px;
        margin-top: 20px;
      }

      .level-preview {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
        margin: 40px auto;
        max-width: 820px;
      }
      .level-card {
        background: #27272a;
        border-radius: 12px;
        padding: 24px 16px;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
      }
      .level-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(88, 194, 242, 0.3);
      }
      .level-card.locked {
        background: #1f1f23;
        color: #555;
        cursor: not-allowed;
      }
      .level-card.locked::after {
        content: "🔒";
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 18px;
      }
      .level-card.unlocked {
        background: #58c2f2;
        color: #000;
      }
      .level-card .level-number {
        font-size: 42px;
        line-height: 1;
      }
      .level-card .level-title {
        font-size: 14px;
        margin-top: 8px;
        opacity: 0.8;
      }

      /* T‑SIDE ORANGE THEME */
      .t-side .blue-dot {
        background: #f59e0b;
        box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.4);
      }
      .t-side .blue-dot.correct {
        background: #fb923c;
        box-shadow: 0 0 0 5px rgba(251, 146, 60, 0.6);
      }
      .t-side .blue-dot.wrong {
        background: #f97316;
        box-shadow: 0 0 0 5px rgba(249, 115, 22, 0.6);
      }
      .t-side .puzzle-feedback-side[style*="background:#c084fc"] {
        background: #fb923c !important;
        color: #111;
      }
      .t-side .level-card.unlocked {
        background: #f59e0b !important;
      }
      .t-side .side-btn.active {
        background: #f59e0b !important;
        color: #111;
      }
      .t-side .phase-btn.active {
        background: #f59e0b !important;
        color: #111;
      }
      .t-side .lessons-header h1,
      .t-side .breadcrumb {
        color: #f59e0b !important;
      }
      .t-side .back-btn:hover {
        background: #f59e0b;
        color: #111;
      }

      .lessons-header h1,
      .breadcrumb {
        color: #58c2f2;
      }
      .back-btn:hover {
        background: #58c2f2;
        color: #111;
      }
      .video-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(88, 194, 242, 0.2);
      }
      .t-side .video-card:hover {
        box-shadow: 0 12px 24px rgba(245, 158, 11, 0.3);
      }

      /* ZONE EDITOR */
      .zone-editor {
        max-width: 1100px;
        margin: 0 auto;
      }
      .zone-canvas-container {
        position: relative;
        display: inline-block;
        border: 6px solid #27272a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .zone-canvas-container canvas {
        position: absolute;
        top: 0;
        left: 0;
        cursor: crosshair;
      }

      /* Utility styles */
      .smoke-cloud {
        position: absolute;
        width: 45px;
        height: 45px;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.3));
      }
      .smoke-cloud::before,
      .smoke-cloud::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #a0a0a0;
      }
      .smoke-cloud::before {
        width: 28px;
        height: 28px;
        top: 3px;
        left: 0;
        box-shadow:
          16px 6px 0 #909090,
          32px 3px 0 #888,
          9px 20px 0 #9a9a9a,
          25px 22px 0 #858585,
          -3px 12px 0 #b0b0b0;
      }
      .smoke-cloud::after {
        width: 35px;
        height: 35px;
        top: 0;
        left: 6px;
        background: radial-gradient(circle at 30% 30%, #b8b8b8, #7a7a7a);
        opacity: 0.95;
      }
      .flash-bang {
        position: absolute;
        width: 28px;
        height: 28px;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
      }
      .flash-bang::before,
      .flash-bang::after,
      .flash-bang .star-arm {
        content: "";
        position: absolute;
        background: #f5f5f5;
        border-radius: 2px;
        box-shadow: 0 0 6px #fef08a;
      }
      .flash-bang::before {
        width: 5px;
        height: 26px;
        top: 1px;
        left: 12px;
        transform: rotate(0deg);
      }
      .flash-bang::after {
        width: 5px;
        height: 26px;
        top: 1px;
        left: 12px;
        transform: rotate(90deg);
      }
      .flash-bang .star-arm {
        width: 4px;
        height: 22px;
        top: 3px;
        left: 12px;
        transform: rotate(45deg);
      }
      .flash-bang .star-arm:nth-child(2) {
        transform: rotate(-45deg);
      }
      .molotov-fire {
        position: absolute;
        width: 50px;
        height: 50px;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
        filter: drop-shadow(0 0 8px #f97316);
      }
      .molotov-fire::before,
      .molotov-fire::after {
        content: "";
        position: absolute;
        border-radius: 50% 20% 50% 20%;
        background: #f97316;
        box-shadow: 0 0 10px #fb923c;
      }
      .molotov-fire::before {
        width: 18px;
        height: 32px;
        top: 8px;
        left: 12px;
        transform: rotate(-20deg);
        background: linear-gradient(45deg, #fffbeb, #f97316 60%, #c2410c);
        border-radius: 40% 20% 40% 20%;
      }
      .molotov-fire::after {
        width: 22px;
        height: 36px;
        top: 4px;
        left: 20px;
        transform: rotate(25deg);
        background: linear-gradient(135deg, #fef08a, #ea580c 70%, #9a3412);
        border-radius: 30% 50% 30% 50%;
        box-shadow: 0 0 12px #fbbf24;
      }
      .molotov-fire .flame-tongue {
        position: absolute;
        width: 14px;
        height: 28px;
        top: 12px;
        left: 8px;
        transform: rotate(-40deg);
        background: linear-gradient(45deg, #fffbeb, #fb923c 80%, #b91c1c);
        border-radius: 50% 20% 50% 20%;
        box-shadow: 0 0 8px #f97316;
      }
      .molotov-fire .flame-tongue:nth-child(2) {
        width: 12px;
        height: 24px;
        top: 6px;
        left: 30px;
        transform: rotate(45deg);
        background: linear-gradient(135deg, #fef08a, #f97316 80%, #7c2d12);
      }

      .utility-tool {
        background: #27272a;
        color: #e0e0e0;
        border: 2px solid #3b3b40;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 500;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .utility-tool:hover {
        background: #3b3b40;
      }
      .utility-tool.active {
        background: #58c2f2;
        color: #000;
        border-color: #58c2f2;
      }

      .ai-game-page .smoke-cloud,
      .ai-game-page .molotov-fire,
      .ai-game-page .flash-bang {
        pointer-events: auto;
      }

      .bomb-marker {
        width: 26px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #a69a70;
        border-radius: 3px;
        background: linear-gradient(135deg, #77765b, #343c2d);
        color: #e8d9a5;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        user-select: none;
      }

      .ai-game-page .bomb-marker {
        pointer-events: auto;
      }

      .nade-explosion {
        position: absolute;
        font-size: 22px;
        line-height: 1;
        transform: translate(-50%, -50%);
        z-index: 5;
        cursor: move;
        user-select: none;
      }

      .he-grenade::before {
        content: "";
        position: absolute;
        width: 7px;
        height: 5px;
        top: -4px;
        left: 3px;
        background: #343a2b;
        border-radius: 2px 2px 0 0;
        border: 1px solid #20251b;
      }

      .he-grenade::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 3px;
        top: 7px;
        left: 0;
        background: #a33b32;
      }
    </style>
  </head>

  <body>
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="logo">cs2.com</div>
      <nav class="nav">
        <div class="nav-item">
          <button class="nav-button">
            <span class="icon">🧩</span><span>Puzzles</span>
          </button>
          <div class="submenu">
            <a
              href="#"
              onclick="
                loadDailyPuzzle();

              "
              class="submenu-item"
              >Puzzles</a
            >
            <a
              href="#"
              onclick="
                loadZoneEditor();
                return false;
              "
              class="submenu-item"
              >Zone Editor</a
            >
            <a
              href="#"
              onclick="
                loadAIGame();
                return false;
              "
              class="submenu-item"
              >Framework</a
            >
          </div>
        </div>
        <div class="nav-item">
          <button class="nav-button">
            <span class="icon">📚</span><span>Learn</span>
          </button>
          <div class="submenu">
            <a
              href="#"
              onclick="
                loadLessons();
                return false;
              "
              class="submenu-item"
              >Lessons</a
            >
          </div>
        </div>
      </nav>
    </div>
    <!-- MAIN CONTENT AREA -->
    <div class="main" id="main-content">
      <div
        style="
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;

        <p style="font-size: 18px">Select a mode from the sidebar.</p>
      </div>
    </div>

      const puzzleData = {
        ct_early: {

            {

                {

                {

        // Helper: convert click event to percentage coordinates relative to the image
        function getImagePercent(e) {
          const containerRect = container.getBoundingClientRect();
          const imageRect = mapImg.getBoundingClientRect();

          // Account for the container's border and padding.
          const originX = containerRect.left + container.clientLeft;
          const originY = containerRect.top + container.clientTop;

          const x = e.clientX - originX;
          const y = e.clientY - originY;

          return {
            left: Math.min(100, Math.max(0, (x / container.clientWidth) * 100)),
            top: Math.min(100, Math.max(0, (y / container.clientHeight) * 100)),
          };
        }

        function initOffscreenCanvas() {
          offscreenCanvas = document.createElement("canvas");
          offscreenCanvas.width = mapImg.naturalWidth || 820;
          offscreenCanvas.height = mapImg.naturalHeight || 820;
          offscreenCtx = offscreenCanvas.getContext("2d");
          offscreenCtx.drawImage(mapImg, 0, 0);
          mapWidth = offscreenCanvas.width;
          mapHeight = offscreenCanvas.height;
        }

        function lineIsClear(p1, p2) {
          if (!offscreenCtx) return true;
          const start = {
            x: Math.floor((p1.left / 100) * mapWidth),
            y: Math.floor((p1.top / 100) * mapHeight),
          };
          const end = {
            x: Math.floor((p2.left / 100) * mapWidth),
            y: Math.floor((p2.top / 100) * mapHeight),
          };
          let x0 = start.x,
            y0 = start.y;
          const x1 = end.x,
            y1 = end.y;
          const dx = Math.abs(x1 - x0),
            dy = Math.abs(y1 - y0);
          const sx = x0 < x1 ? 1 : -1,
            sy = y0 < y1 ? 1 : -1;
          let err = dx - dy;
          while (true) {
            if (x0 < 0 || x0 >= mapWidth || y0 < 0 || y0 >= mapHeight)
              return false;
            const pixel = offscreenCtx.getImageData(x0, y0, 1, 1).data;
            const r = pixel[0],
              g = pixel[1],
              b = pixel[2];
            if ((r > 200 && g > 200 && b > 200) || (r < 50 && g < 50 && b < 50))
              return false;
            if (x0 === x1 && y0 === y1) break;
            const e2 = 2 * err;
            if (e2 > -dy) {
              err -= dy;
              x0 += sx;
            }
            if (e2 < dx) {
              err += dx;
              y0 += sy;
            }
          }
          return true;
        }

        function drawAllLines() {
          svg.innerHTML = "";

            tDots.forEach((t) => {
              const tPos = { left: t.left, top: t.top };
              if (!lineIsClear(ctPos, tPos)) return;
              const line = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line",
              );
              line.setAttribute("x1", ct.left + "%");
              line.setAttribute("y1", ct.top + "%");
              line.setAttribute("x2", t.left + "%");
              line.setAttribute("y2", t.top + "%");
              line.setAttribute("stroke", "#ffffff");
              line.setAttribute("stroke-width", "1.5");
              line.setAttribute("stroke-opacity", "0.3");
              line.setAttribute("stroke-dasharray", "4 4");
              svg.appendChild(line);
            });
          });
        }

        function makeUtilityDraggable(util) {

        // Jiggle (unchanged)
        function jiggleLoop() {
          if (jiggleDots.size === 0) {
            jiggleAnimationId = null;
            return;
          }
          const now = Date.now() / 1000;
          jiggleDots.forEach((dotData) => {
            const offset = Math.sin(now * Math.PI * 2) * 50;
            if (dotData.jiggleDirection === "vertical") {
              dotData.element.style.transform = `translate(-50%, -50%) translateY(${offset}px)`;
            } else {
              dotData.element.style.transform = `translate(-50%, -50%) translateX(${offset}px)`;
            }
          });
          jiggleAnimationId = requestAnimationFrame(jiggleLoop);
        }

        function toggleJiggle(dotData, newDirection) {
          if (newDirection === undefined) {
            if (dotData.jiggling) {
              dotData.jiggling = false;
              jiggleDots.delete(dotData);
              dotData.element.style.transform = "translate(-50%, -50%)";
              dotData.element.style.boxShadow =
                dotData.type === "ct"
                  ? "0 0 0 5px rgba(88,194,242,0.4)"
                  : "0 0 0 5px rgba(245,158,11,0.4)";
            } else {
              if (!dotData.jiggleDirection)
                dotData.jiggleDirection = "horizontal";
              dotData.jiggling = true;
              jiggleDots.add(dotData);
              dotData.element.style.boxShadow =
                dotData.type === "ct"
                  ? "0 0 0 5px cyan"
                  : "0 0 0 5px rgba(255, 165, 0, 0.9)";
              dotData.element.style.transform = "translate(-50%, -50%)";
            }
          } else {
            if (dotData.jiggling) {
              dotData.jiggleDirection = newDirection;
            } else {
              dotData.jiggling = true;
              dotData.jiggleDirection = newDirection;
              jiggleDots.add(dotData);
              dotData.element.style.boxShadow =

                  : "0 0 0 5px rgba(255, 165, 0, 0.9)";

          if (jiggleDots.size > 0 && !jiggleAnimationId) jiggleLoop();

            if (!dragging) return;

            document.removeEventListener("mouseup", onMouseUp);
            if (wasJiggling) {
              dotData.jiggling = true;
              dotData.jiggleDirection = savedDirection;

              dotData.element.style.boxShadow =
                dotData.type === "ct"

              if (!jiggleAnimationId) jiggleLoop();
              wasJiggling = false;
              savedDirection = null;

          dotData.element.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            e.stopImmediatePropagation();
            if (dotData.jiggling) {
              wasJiggling = true;
              savedDirection = dotData.jiggleDirection;
              dotData.jiggling = false;
              jiggleDots.delete(dotData);
              dotData.element.style.transform = "translate(-50%, -50%)";

            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);

              "active",
              (mode === "none" && btn.id === "tool-none") ||
                (mode === "smoke" && btn.id === "tool-smoke") ||
                (mode === "molotov" && btn.id === "tool-molotov") ||
                (mode === "flash" && btn.id === "tool-flash") ||
                (mode === "nade" && btn.id === "tool-nade") ||
                (mode === "bomb" && btn.id === "tool-bomb"),
            );
          });
          statusSpan.textContent =
            mode === "none" ? "Dot mode active" : `Click map to place ${mode}`;
        };

        function spawnDots() {
          container
            .querySelectorAll(
              ".blue-dot, .smoke-cloud, .molotov-fire, .flash-bang, .he-grenade, .bomb-marker",
            )
            .forEach((el) => el.remove());
          ctDots = [];
          tDots = [];
          utilities = [];
          selectedDot = null;
          jiggleDots.clear();
          if (jiggleAnimationId) {
            cancelAnimationFrame(jiggleAnimationId);
            jiggleAnimationId = null;
          }

          ctSpawns.forEach((pos, i) => {
            const id = i + 1;
            const dot = createDot(
              parseFloat(pos.left),
              parseFloat(pos.top),
              "#58c2f2",
              "rgba(88,194,242,0.4)",
              id,
            );
            const dotData = {
              element: dot,
              id,
              left: parseFloat(pos.left),
              top: parseFloat(pos.top),
              type: "ct",
              jiggling: false,
              jiggleDirection: "horizontal",
            };
            ctDots.push(dotData);
            makeDotClickableAndRemovable(dotData);
            makeDotDraggable(dotData);
          });

          tSpawns.forEach((pos, i) => {
            const id = i + 1;
            const dot = createDot(
              parseFloat(pos.left),
              parseFloat(pos.top),
              "#f59e0b",
              "rgba(245,158,11,0.4)",
              id,
            );
            const dotData = {
              element: dot,
              id,
              left: parseFloat(pos.left),
              top: parseFloat(pos.top),
              type: "t",
              jiggling: false,
              jiggleDirection: "horizontal",
            };
            tDots.push(dotData);
            makeDotClickableAndRemovable(dotData);
            makeDotDraggable(dotData);
          });

          drawAllLines();
        }

        function resetDots() {
          spawnDots();
          statusSpan.textContent = "All reset";
        }

        container.addEventListener("click", handleMapClick);

        if (mapImg.complete) {
          initOffscreenCanvas();
          spawnDots();
        } else {
          mapImg.onload = () => {
            initOffscreenCanvas();
            spawnDots();
          };
        }

        statusSpan.textContent =
          "Right‑click dot → jiggle | Ctrl+right‑click → change direction | Click map to place";
        document.getElementById("reset-ai-dots").onclick = resetDots;
      };

      // ==================== REMAINING ORIGINAL FUNCTIONS ====================
      // (All other functions like loadLessons, loadDailyPuzzle, etc. are identical to previous version)
      window.loadHome = function () {
        document.getElementById("main-content").innerHTML =
          `<div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#555;text-align:center;"><h1 style="font-size:42px;margin-bottom:16px;color:#58c2f2;">cs2.com</h1><p style="font-size:18px;">Select a mode from the sidebar.</p></div>`;
      };
      // ... all other functions ...
    </script>
  </body>
</html>
